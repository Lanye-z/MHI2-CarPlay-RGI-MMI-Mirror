name: Restore stable CarPlay RGI payload

on:
  push:
    paths:
      - '.github/workflows/restore-stable-rgi.yml'

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore stable RGI payload and audit second-screen remnants
        shell: bash
        run: |
          set -euo pipefail

          tmp="$(mktemp -d)"
          git clone --depth 1 --branch master https://github.com/Lanye-z/mib2-toolbox-carplay-rgi.git "$tmp/stable"

          # The public combined repository had accidentally inherited the three
          # binaries that lived under the old integration repository's test/
          # directory. Restore the formal stable RGI payload instead.
          cp "$tmp/stable/Toolbox/apps/carplay-rgi/carplay_hook.jar" Toolbox/apps/carplay-rgi/carplay_hook.jar
          cp "$tmp/stable/Toolbox/apps/carplay-rgi/libcarplay_hook.so" Toolbox/apps/carplay-rgi/libcarplay_hook.so
          cp "$tmp/stable/Toolbox/apps/carplay-rgi/maneuver_render" Toolbox/apps/carplay-rgi/maneuver_render

          # Verify exact stable Git blob identities from the formal payload.
          test "$(git hash-object Toolbox/apps/carplay-rgi/carplay_hook.jar)" = "20e39b8a83968e6441eb80808c5dadbd303b5d34"
          test "$(git hash-object Toolbox/apps/carplay-rgi/libcarplay_hook.so)" = "a86f81a2ba5217fb6b029446a8af48bfdca0274c"
          test "$(git hash-object Toolbox/apps/carplay-rgi/maneuver_render)" = "6f92a5ff587042fcaeb2d634880f9fb02ae8633e"
          test "$(git hash-object Toolbox/apps/carplay-rgi/flag_atlas.rgba)" = "b4537f3e0db77842945a9d7bd7d8f415a699679a"

          # No dedicated CarPlay AltScreen / second-screen experiment file may
          # remain in the release tree. Do not confuse normal MMI screen capture
          # or the stock Toolbox 'Second Phone' vehicle setting with this audit.
          if find . -type f \( -iname '*altscreen*' -o -iname '*alt-screen*' -o -iname '*alt_screen*' -o -iname '*second-screen*' -o -iname '*second_screen*' -o -iname '*screen2*' \) -print -quit | grep -q .; then
            echo 'Second-screen experiment file name detected:' >&2
            find . -type f \( -iname '*altscreen*' -o -iname '*alt-screen*' -o -iname '*alt_screen*' -o -iname '*second-screen*' -o -iname '*second_screen*' -o -iname '*screen2*' \) -print >&2
            exit 1
          fi

          if grep -RIniE --include='*.sh' --include='*.esd' \
            '(altscreen|alt[ _-]?screen|second[ _-]?screen|secondary[ _-]?screen|screen2|displayable[ _-]?58|context[ _-]?76)' \
            Toolbox Cluster-HMI MMI-Mirror 2>/dev/null; then
            echo 'Second-screen experiment reference detected in .sh/.esd.' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            Toolbox/apps/carplay-rgi/carplay_hook.jar \
            Toolbox/apps/carplay-rgi/libcarplay_hook.so \
            Toolbox/apps/carplay-rgi/maneuver_render

          if git diff --cached --quiet; then
            echo 'Stable RGI payload already present.'
            exit 0
          fi

          git commit -m 'Restore stable CarPlay RGI payload'
          git push
